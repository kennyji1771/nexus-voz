[project]
name = "nexus-vox"
version = "3.1.0"
description = "Nexus.Vox - TTS CPU-first nativo en español latino con clonación de voz."
readme = "README.md"
requires-python = ">= 3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Kenny Ji", email = "sieveresk@gmail.com" },
]
keywords = [
    "text-to-speech",
    "tts",
    "spanish",
    "español",
    "latinoamerica",
    "voice-cloning",
    "cpu",
    "no-gpu",
    "lightweight",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=2",
    # I tried 2.4.0 but the generated audio is wrong, so 2.5+ is needed.
    "torch>=2.5.0",
    "pydantic>=2",
    "sentencepiece>=0.2.1",
    "safetensors>=0.4.0",
    "typer>=0.10.0",
    "typing_extensions>=4.10.0",
    "fastapi>=0.100",
    "uvicorn>=0.13.0",
    "python-multipart>=0.0.21",
    "scipy>=1.5.0",
    "einops>=0.4.0",
    "huggingface_hub>=0.13.0",
    "requests>=2.20.0",
]

[project.optional-dependencies]
audio = ["soundfile>=0.12.0"]
quantize = ["torchao>=0.16.0"]

[project.urls]
Homepage = "https://github.com/kennyji1771/nexus-voz"
Repository = "https://github.com/kennyji1771/nexus-voz"
Issues = "https://github.com/kennyji1771/nexus-voz/issues"
Changelog = "https://github.com/kennyji1771/nexus-voz/commits/main"

[dependency-groups]
dev = [
    "coverage>=7.6.12",
    "jiwer>=3.0",
    "line-profiler>=5.0.0",
    "mkdocs>=1.6.1",
    "mkdocs-autolinks-plugin>=0.7.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings-python>=2.0.1",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0",
    "soundfile",
    "sphn>=0.1.4",
    "torchaudio",
    "transformers>=4.40",
    "tqdm>=4.60",
    "utmos-pytorch>=0.1.0",
    "whisper-normalizer>=0.0.10",
    "ty>=0.0.77",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.format]
line-ending = "lf"
skip-magic-trailing-comma = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_vox"]
exclude = [
    "nexus_vox/voices/**/*.safetensors",
    "nexus_vox/voices/**/*.wav",
    "**/__pycache__/**",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "nexus_vox/voices/**/*.safetensors",
    "nexus_vox/voices/**/*.wav",
    "**/__pycache__/**",
    "tests/**",
    "training/**",
    "scripts/**",
]

[project.scripts]
nexus-vox = "nexus_vox.main:cli_app"

[tool.uv]
exclude-newer = "7 days"
python-preference = "only-managed"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.src]
exclude = ["docs/"]

[tool.ty.rules]
missing-type-argument = "error"

[[tool.ty.overrides]]
include = ["nexus_vox/quantization.py"]

[tool.ty.overrides.rules]
deprecated = "ignore"